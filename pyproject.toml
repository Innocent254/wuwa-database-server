[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wuwa-data-builder"
version = "0.1.0"
description = "Manual data builder and GitHub update feed for an unofficial Wuthering Waves companion app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.10,<4",
  "orjson>=3.10,<4",
  "Pillow>=10.4,<12",
  "playwright>=1.45,<2",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1"
]

[project.scripts]
wuwa-builder = "wuwa_builder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["wuwa_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
