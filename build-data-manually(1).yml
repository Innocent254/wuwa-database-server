name: Build WuWa database manually

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run only, or publish the generated update"
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
      max_items_per_dataset:
        description: "Maximum records to collect for each dataset"
        required: true
        default: "250"
      include_images:
        description: "Reserved for license-cleared images; keep disabled for Fandom data"
        required: true
        type: boolean
        default: false
      version_override:
        description: "Optional version, for example 0.2.0. Leave blank for 0.1.<run number>."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: manual-wuwa-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install builder and tests
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          else
            VERSION="0.1.${{ github.run_number }}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and validate update
        run: |
          python -m wuwa_builder.cli             --output build/release             --version "${{ steps.version.outputs.value }}"             --max-items-per-dataset "${{ inputs.max_items_per_dataset }}"             ${{ inputs.include_images && '--include-images' || '--no-include-images' }}

      - name: Show build summary
        run: |
          echo "## WuWa data build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat build/release/CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: **${{ inputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-data-${{ steps.version.outputs.value }}
          path: |
            build/release/version.json
            build/release/catalog.json
            build/release/database-full.wupack
            build/release/assets-full.wupack
            build/release/CHANGELOG.md
            build/release/ATTRIBUTION.md
            build/release/DATA_LICENSE.md
          retention-days: 14

      - name: Update stable public manifest
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          mkdir -p public/latest
          cp build/release/version.json public/latest/version.json
          cp build/release/catalog.json public/latest/catalog.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest
          if ! git diff --cached --quiet; then
            git commit -m "Publish data ${{ steps.version.outputs.value }}"
            git push
          fi

      - name: Publish immutable GitHub Release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="data-v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               build/release/database-full.wupack               build/release/assets-full.wupack               build/release/version.json               build/release/catalog.json               build/release/ATTRIBUTION.md               build/release/DATA_LICENSE.md               --clobber
          else
            gh release create "$TAG"               build/release/database-full.wupack               build/release/assets-full.wupack               build/release/version.json               build/release/catalog.json               build/release/ATTRIBUTION.md               build/release/DATA_LICENSE.md               --title "WuWa data ${{ steps.version.outputs.value }}"               --notes-file build/release/CHANGELOG.md
          fi
